version: 2

# Updates of Maven dependencies that only change versions merge by
# themselves once CI passes (see .github/workflows/dependabot.yml), so each
# update waits a week after its version is published, the time a
# compromised release usually takes to be found and pulled. Updates of
# actions, which the maintainer merges, wait as long. Security updates,
# where they're turned on, don't wait.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # Compiled against deliberately: the oldest server API upstream supports
      - dependency-name: com.destroystokyo.paper:paper-api
      # Servers run the DuckDB driver that CoreProtect's plugin.yml has them
      # download. scripts/lp builds with that version whenever plugin.yml
      # names one, so the version in pom.xml only counts for CoreProtect
      # versions without DuckDB, whose servers don't run it. Updates to it
      # would change nothing that servers run.
      - dependency-name: org.duckdb:duckdb_jdbc
