version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    ignore:
      # Compiled against deliberately: the oldest server API upstream supports
      - dependency-name: com.destroystokyo.paper:paper-api
