name: Development build

# Builds LibreProtect from an upstream commit that isn't a release, normally
# the tip of upstream's default branch, and publishes it as a prerelease.
# upstream-watch dispatches this whenever upstream's default branch moves.
#
# Review findings don't block development builds; they are listed in the
# release notes. Audit failures do, and open an issue.

run-name: Development build of upstream ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream commit, branch or tag to build
        required: true

permissions:
  contents: read

concurrency:
  group: dev-${{ inputs.ref }}

jobs:
  build:
    name: Build, test and audit
    runs-on: ubuntu-latest
    # As long as CI's, plus the source archive
    timeout-minutes: 50
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/it/paper-*
          key: paper-${{ hashFiles('integration/paper.lock') }}

      - name: Start database containers
        # MySQL and ClickHouse, for the unit tests of the database code and the integration test
        run: scripts/lp db up --all

      - name: Build
        run: scripts/lp build --ref "$REF"
        env:
          REF: ${{ inputs.ref }}

      - name: Integration test
        run: scripts/lp it

      - name: Remove database containers
        if: always()
        run: scripts/lp db down

      - name: Source archive
        run: scripts/lp sources

      - name: Summarize
        if: always()
        run: scripts/ci/summary.sh >> "$GITHUB_STEP_SUMMARY"

      - id: meta
        run: echo "version=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-logs
          path: |
            build/it/*/console-*.log
            build/it/*/egress-*.log
            build/it/*/logs/
          if-no-files-found: ignore

  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/LibreProtect-*.jar

      - name: Publish
        run: scripts/ci/publish.sh --prerelease --upstream-ref "$REF"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}

  report:
    name: Report outcome
    needs: [build, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update or close the failure issue
        run: scripts/ci/report.sh "Development build" "$SUCCEEDED" "upstream $REF"
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          SUCCEEDED: ${{ needs.build.result == 'success' && needs.publish.result == 'success' }}
