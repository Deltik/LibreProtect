name: CI

# Builds the upstream release pinned in upstream.lock, and the tip of
# upstream's master branch (CoreProtect's next release), transforms and
# audits each, and integration tests the results on a real Paper server.
#
# upstream-watch dispatches this workflow on bump branches, because pull
# requests opened with GITHUB_TOKEN don't trigger workflows by themselves.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Branch protection requires the job for upstream.lock by name. The job
    # for upstream master shows early what CoreProtect's next release breaks;
    # as in development builds, its audit findings that need review don't
    # fail it. Its build, tests and integration test do, but the workflow
    # still passes, since upstream's master can break without a change here.
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.ref != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build, test and audit
            ref: ''
            artifact: dist
            logs: integration-logs
          - name: Build, test and audit (upstream master)
            ref: master
            artifact: dist-upstream-master
            logs: integration-logs-upstream-master
    runs-on: ubuntu-latest
    # A CoreProtect 25 build and integration test took 21 minutes on a
    # developer's machine that other builds kept busy
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream's build runs in this job; don't leave a token lying around
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/it/paper-*
          key: paper-${{ hashFiles('integration/paper.lock') }}

      - name: Start database containers
        # MySQL and ClickHouse, for the unit tests of the database code and the
        # integration test. Without --all, ClickHouse would start only if an
        # upstream checkout of CoreProtect 25 existed already, which it doesn't yet.
        run: scripts/lp db up --all

      - name: Build
        run: scripts/lp build ${REF:+--ref "$REF"}
        env:
          REF: ${{ matrix.ref }}

      - name: Integration test
        run: scripts/lp it

      - name: Remove database containers
        if: always()
        run: scripts/lp db down

      - name: Summarize
        if: always()
        # The summary names the artifact that this job uploads
        run: scripts/ci/summary.sh | sed "s/(in the \`dist\` artifact)/(in the \`$ARTIFACT\` artifact)/" >> "$GITHUB_STEP_SUMMARY"
        env:
          ARTIFACT: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ${{ matrix.logs }}
          path: |
            build/it/*/console-*.log
            build/it/*/egress-*.log
            build/it/*/logs/
          if-no-files-found: ignore

      - name: Require a reviewed audit baseline
        if: matrix.ref == ''
        run: scripts/ci/require-reviewed.sh dist/audit-report.json

  license-notices:
    # Branch protection requires this job by name too. It needs neither Java
    # nor upstream, so it reports within seconds.
    name: License notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that source files begin with the license notice
        run: scripts/lp headers
