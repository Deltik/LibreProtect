name: CI

# Builds the upstream release pinned in upstream.lock, transforms and audits
# it, and integration tests the result on a real Paper server.
#
# upstream-watch dispatches this workflow on bump branches, because pull
# requests opened with GITHUB_TOKEN don't trigger workflows by themselves.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Branch protection requires this job by name
    name: Build, test and audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Upstream's build runs in this job; don't leave a token lying around
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/it/paper-*
          key: paper-${{ hashFiles('integration/paper.lock') }}

      - name: Build
        run: scripts/lp build

      - name: Integration test
        run: scripts/lp it

      - name: Summarize
        if: always()
        run: scripts/ci/summary.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dist
          path: dist/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-logs
          path: |
            build/it/server/console-*.log
            build/it/server/egress-*.log
            build/it/server/logs/
          if-no-files-found: ignore

      - name: Require a reviewed audit baseline
        run: scripts/ci/require-reviewed.sh dist/audit-report.json

  license-notices:
    # Branch protection requires this job by name too. It needs neither Java
    # nor upstream, so it reports within seconds.
    name: License notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that source files begin with the license notice
        run: scripts/lp headers
